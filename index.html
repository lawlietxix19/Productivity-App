<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A productivity app to help you manage your tasks effectively.">
    <title>Productivity App N5</title>
</head>
<body>
    <header>
        <h1>Welcome to Productivity App N5</h1>
        <h2>In order for you to get our product you need to fill the form bellow</h2>
    </header>
    <main>
        <form action="mailto:hgdfkfrhhcf@gmail.com" method="get">
            <fieldset>
                <legend>Personal Information</legend>
                <label>Name:</label>
                <input type="text" placeholder="Company name" autocomplete="on" required>
                <br /><p></p>
                <label>Email:</label>
                <input type="email" autocomplete="on" placeholder="something@gmail.com" required>
                <br /><p></p>
                <label>country code:</label>
                <select required>
                    <option>+98(Iran)</option>
                    <option>+964(Iraq)</option>
                    <option>+961(Lebanon)</option>
                </select>
                <br /><p></p>
                <label>tel:</label>
                <input type="tel" placeholder="9123456789" autocomplete="on" required>
            </fieldset>
            <br /><p></p>
            <fieldset>
                <legend>Company Information</legend>
                <label>company size:</label>
                <select required>
                    <option>1-10 employees</option>
                    <option>11-50 employees</option>
                    <option>51-200 employees</option>
                    <option>201-500 employees</option>
                    <option>500-1000 employees </option>
                    <option>1000+ employees</option>
                </select>
                <br /><p></p>
                <label>Management Team size</label>
                <input type="number" min="1" max="100" placeholder="Size" autocomplete="on" required />
                <br /><p></p>
                <p>Set your budget range per month (min: $10, max: $1000)</p>
                <input type="range" min="10" max="1000" step="10" />
            </fieldset>
            <br /><p></p>
            <fieldset>
                <legend>Product info</legend>
                <p>Purchase Timeline</p>
                <input type="radio" name="Timeline" />
                <label>Immediately</label><br />
                <input type="radio" name="Timeline" />
                <label>1-3 months</label><br />
                <input type="radio" name="Timeline" />
                <label>3-6 months</label><br />
                <input type="radio" name="Timeline" />
                <label>Just exploring</label>
                <br /><p></p>
                <p>theme preferences</p>
                <input type="color" required/>
                <label>background theme</label><br />
                <input type="color" required/>
                <label>font color</label>
                <br /><p></p>
                <p>Onboarding Date</p>
                <input type="date" required/>
            </fieldset>
            <br /><p></p>
            <fieldset>
                <legend>Features</legend>
                <input type="checkbox" />
                <label>Automation</label><br />
                <input type="checkbox" />
                <label>Collaboration</label><br />
                <input type="checkbox" />
                <label>Integrations</label><br />
                <input type="checkbox" />
                <label>Security</label><br />
                <input type="checkbox" />
                <label>Mobile Access</label><br />
                <input type="checkbox" />
                <label>Custom Workflows</label><br />
            </fieldset>
            <br /><p></p>
            <button type="submit">send request</button>
        </form>
    </main>
</body>
</html>
